[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vexsym"
version = "1.0.0"
description = "Bounded Relational Symbolic Execution for Decompilation Verification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VexSym Authors"},
]
keywords = [
    "binary-analysis",
    "symbolic-execution",
    "decompilation",
    "verification",
    "angr",
    "VEX-IR",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "angr>=9.2",
    "claripy>=9.2",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
    "z3-solver>=4.12",
    "cxxfilt>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "requests>=2.28",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/tbd-mavenkoders/VexSym"
Repository = "https://github.com/tbd-mavenkoders/VexSym"
Issues = "https://github.com/tbd-mavenkoders/VexSym/issues"

[project.scripts]
vexsym-server = "vexsym.api.server:main"

[tool.setuptools.packages.find]
include = ["vexsym*"]

[tool.pytest.ini_options]
testpaths = ["vexsym/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
